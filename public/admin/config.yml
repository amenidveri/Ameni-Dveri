backend:
  name: github
  repo: your-org/ameni-site   # TODO: заменить на реальный репозиторий на GitHub
  branch: main

media_folder: "public/images/categories"
public_folder: "/images/categories"

collections:
  - name: "site"
    label: "Настройки сайта"
    files:
      - name: "header"
        label: "Шапка"
        file: "content/settings/header.yml"
        fields:
          - { name: "logo_text_main", label: "Логотип — первое слово", widget: "string", default: "AMENI" }
          - { name: "logo_text_sub", label: "Логотип — второе слово", widget: "string", default: "ДВЕРІ" }
          - { name: "logo_color", label: "Цвет логотипа", widget: "color", default: "#F4F7F1" }
          - { name: "header_bg", label: "Цвет фона шапки", widget: "color", default: "#4F5F4C" }
          - { name: "phone", label: "Номер телефона", widget: "string", default: "+380000000000" }
          - { name: "viber_link", label: "Ссылка Viber", widget: "string", default: "viber://chat" }
          - { name: "telegram_link", label: "Ссылка Telegram", widget: "string", default: "https://t.me/" }
          - { name: "instagram_link", label: "Ссылка Instagram", widget: "string", default: "https://instagram.com/" }
      - name: "footer"
        label: "О нас / Футер"
        file: "content/settings/footer.yml"
        fields:
          - { name: "about_text", label: "Текст «О нас»", widget: "text" }
          - { name: "phone", label: "Телефон", widget: "string" }
          - { name: "email", label: "Email", widget: "string" }
          - { name: "address", label: "Адрес", widget: "string" }
          - { name: "hours", label: "Режим работы", widget: "string", default: "Пн–Вс: 08:00–20:00, без выходных" }
          - { name: "tagline", label: "Тёплая фраза-приглашение", widget: "string" }

  - name: "categories"
    label: "Категории (квадраты на главной)"
    folder: "content/categories"
    create: true
    delete: true
    slug: "{{slug}}"
    label_singular: "Категория"
    summary: "{{title}}"
    fields:
      - { name: "title", label: "Название", widget: "string" }
      - { name: "image", label: "Картинка", widget: "image" }
      - { name: "link", label: "Ссылка на страницу категории", widget: "string" }
      - { name: "order", label: "Порядок на странице", widget: "number", default: 0 }
      - { name: "published", label: "Показывать на сайте", widget: "boolean", default: true }

  - name: "products"
    label: "Товары (конкретные модели дверей/ручек)"
    folder: "content/products"
    create: true
    delete: true
    slug: "{{slug}}"
    label_singular: "Товар"
    summary: "{{title}} — {{category}}"
    fields:
      - { name: "title", label: "Название модели", widget: "string" }
      - { name: "image", label: "Фото", widget: "image" }
      - { name: "category", label: "Раздел", widget: "relation", collection: "categories", search_fields: ["title"], value_field: "{{slug}}", display_fields: ["title"] }
      - { name: "subcategory", label: "Под-раздел (напр. «с зеркалом», «с шпоном»)", widget: "string", required: false, hint: "Оставь пустым для базовых/обычных моделей" }
      - { name: "popular", label: "Ходовая модель (показывать в топе на главной)", widget: "boolean", default: false }
      - { name: "order", label: "Порядок", widget: "number", default: 0 }
      - { name: "published", label: "Показывать на сайте", widget: "boolean", default: true }

  - name: "videos"
    label: "Видео (главная)"
    folder: "content/videos"
    create: true
    delete: true
    slug: "{{slug}}"
    label_singular: "Видео"
    summary: "{{title}}"
    fields:
      - { name: "title", label: "Название", widget: "string" }
      - { name: "video_url", label: "Файл видео", widget: "file" }
      - { name: "poster", label: "Превью (обложка)", widget: "image" }
      - { name: "category", label: "Привязать к категории (необязательно)", widget: "relation", collection: "categories", search_fields: ["title"], value_field: "{{slug}}", display_fields: ["title"], required: false }
      - { name: "order", label: "Порядок", widget: "number", default: 0 }
      - { name: "published", label: "Показывать на сайте", widget: "boolean", default: true }

  - name: "articles"
    label: "Статьи"
    folder: "content/articles"
    create: true
    delete: true
    slug: "{{slug}}"
    label_singular: "Статья"
    summary: "{{title}}"
    fields:
      - { name: "title", label: "Заголовок", widget: "string" }
      - { name: "image", label: "Обложка", widget: "image" }
      - { name: "date", label: "Дата публикации", widget: "datetime" }
      - { name: "published", label: "Опубликовано", widget: "boolean", default: true }
      - { name: "body", label: "Текст статьи", widget: "markdown" }

  - name: "reviews"
    label: "Отзывы"
    folder: "content/reviews"
    create: true
    delete: true
    slug: "{{slug}}"
    label_singular: "Отзыв"
    summary: "{{name}}"
    fields:
      - { name: "name", label: "Имя клиента", widget: "string" }
      - { name: "rating", label: "Оценка (1-5)", widget: "number", default: 5, min: 1, max: 5 }
      - { name: "text", label: "Текст отзыва", widget: "text" }
      - { name: "order", label: "Порядок", widget: "number", default: 0 }
      - { name: "published", label: "Показывать на сайте", widget: "boolean", default: true }
